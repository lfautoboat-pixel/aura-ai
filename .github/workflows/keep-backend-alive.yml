name: Keep backend alive

# Render's free tier spins the backend down after ~15 minutes with no
# inbound traffic, and the first request after that takes 50-75+ seconds to
# respond — long enough that real visitors from paid ads bounce before the
# page ever finishes loading. Pinging every 10 minutes keeps it inside that
# window so it never sleeps. Costs nothing: this repo already has GitHub
# Actions available, and one instance kept alive 24/7 stays well under
# Render's free 750 instance-hours/month.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf -m 30 https://aura-ai-backend-b33k.onrender.com/api/ || echo "ping failed (backend may have been cold — next run will catch it)"
